name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-portfolio]

# Every deploy reassembles and redeploys the *whole* site (production +
# every open PR's preview — see scripts/deploy-pages.ts), so this and
# cleanup-preview.yml share one strictly-queued lane: a stale assembly
# could otherwise overwrite a newer one.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Set NEXT_PUBLIC_BASE_PATH for this deploy
        run: pnpm tsx scripts/deploy-pages.ts base-path

      - name: Build project
        run: pnpm run build 2>&1 | tee build-output.log
        env:
          GH_API_TOKEN: ${{ secrets.API_TOKEN }}
          GH_API_USERNAME: ${{ secrets.API_USERNAME }}
          PORTFOLIO_REQUIRE_LIVE_DATA: "true"
          NO_COLOR: "1"

      - name: Bundle size summary
        run: |
          {
            echo "## Bundle size"
            echo
            echo '```'
            sed -n '/^Route (app)/,/^$/p' build-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store this build and assemble the combined site
        run: pnpm tsx scripts/deploy-pages.ts publish

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./combined

      # actions/deploy-pages looks up the artifact it was just handed through
      # GitHub's own artifact-listing API, which can lag a few seconds behind
      # the upload finishing — without this it sometimes sees "0 artifacts"
      # and fails outright (see run logs: upload finalizes, then deploy-pages
      # queries metadata under a second later and comes up empty).
      - name: Wait for the uploaded artifact to be queryable
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Comment preview link on the PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm tsx scripts/comment-preview-link.ts
