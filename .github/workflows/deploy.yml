name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-portfolio]

# Every deploy reassembles and redeploys the *whole* site (production +
# every open PR's preview — see assemble-pages.sh), so two of these can
# never safely run at once: a single global, strictly-queued lane avoids
# one run's deploy overwriting another's with a stale assembly.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      IS_CLOSED: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
      SLOT: ${{ (github.event_name == 'pull_request' && format('PR-{0}', github.event.pull_request.number)) || 'production' }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        if: env.IS_CLOSED != 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: env.IS_CLOSED != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        if: env.IS_CLOSED != 'true'
        run: pnpm install

      - name: Build project
        if: env.IS_CLOSED != 'true'
        run: pnpm run build 2>&1 | tee build-output.log
        env:
          GH_API_TOKEN: ${{ secrets.API_TOKEN }}
          GH_API_USERNAME: ${{ secrets.API_USERNAME }}
          PORTFOLIO_REQUIRE_LIVE_DATA: "true"
          # A PR preview is served at marcllobet.github.io/PR-<number>/,
          # production at the domain root.
          NEXT_PUBLIC_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/PR-{0}', github.event.pull_request.number) || '' }}
          NO_COLOR: "1"

      - name: Bundle size summary
        if: always() && env.IS_CLOSED != 'true'
        run: |
          {
            echo "## Bundle size"
            echo
            echo '```'
            sed -n '/^Route (app)/,/^$/p' build-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update this slot on the pages-store branch
        env:
          MODE: ${{ env.IS_CLOSED == 'true' && 'cleanup' || 'publish' }}
          SOURCE_DIR: ./out
          COMMIT_MESSAGE: ${{ env.IS_CLOSED == 'true' && format('Remove preview for PR #{0}', github.event.pull_request.number) || format('Update {0} ({1})', env.SLOT, github.sha) }}
        run: .github/scripts/update-pages-store.sh

      - name: Assemble the combined site
        env:
          OUT_DIR: ./combined
        run: .github/scripts/assemble-pages.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./combined

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Comment preview link on the PR
        if: github.event_name == 'pull_request' && env.IS_CLOSED != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://marcllobet.github.io/PR-${prNumber}/`;
            const marker = "<!-- pr-preview-link -->";
            const body = `${marker}\n🔎 Preview deployed: ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
