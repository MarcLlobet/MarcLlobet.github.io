name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-portfolio]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build 2>&1 | tee build-output.log
        env:
          GH_API_TOKEN: ${{ secrets.API_TOKEN }}
          GH_API_USERNAME: ${{ secrets.API_USERNAME }}
          PORTFOLIO_REQUIRE_LIVE_DATA: "true"
          NO_COLOR: "1"

      - name: Bundle size summary
        if: always()
        run: |
          {
            echo "## Bundle size"
            echo
            echo '```'
            sed -n '/^Route (app)/,/^$/p' build-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
