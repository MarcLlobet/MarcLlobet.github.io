name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-portfolio]

concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build 2>&1 | tee build-output.log
        env:
          GH_API_TOKEN: ${{ secrets.API_TOKEN }}
          GH_API_USERNAME: ${{ secrets.API_USERNAME }}
          PORTFOLIO_REQUIRE_LIVE_DATA: "true"
          # A PR preview is served at marcllobet.github.io/PR-<number>/,
          # production at the domain root — empty for every other trigger.
          NEXT_PUBLIC_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/PR-{0}', github.event.pull_request.number) || '' }}
          NO_COLOR: "1"

      - name: Bundle size summary
        if: always()
        run: |
          {
            echo "## Bundle size"
            echo
            echo '```'
            sed -n '/^Route (app)/,/^$/p' build-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./out
          retention-days: 1

  deploy:
    needs: build

    permissions:
      contents: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ./out

      - name: Deploy to gh-pages
        env:
          MODE: publish
          SOURCE_DIR: ./out
          DEST_DIR: ${{ github.event_name == 'pull_request' && format('PR-{0}', github.event.pull_request.number) || '.' }}
          COMMIT_MESSAGE: >-
            ${{ github.event_name == 'pull_request'
              && format('Deploy preview for PR #{0} ({1})', github.event.pull_request.number, github.sha)
              || format('Deploy production ({0})', github.sha) }}
        run: .github/scripts/deploy-gh-pages.sh

      - name: Comment preview link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://marcllobet.github.io/PR-${prNumber}/`;
            const marker = "<!-- pr-preview-link -->";
            const body = `${marker}\n🔎 Preview deployed: ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Remove the PR's preview folder
        env:
          MODE: cleanup
          DEST_DIR: PR-${{ github.event.pull_request.number }}
          COMMIT_MESSAGE: Remove preview for PR #${{ github.event.pull_request.number }}
        run: .github/scripts/deploy-gh-pages.sh
