name: CI

# The site fetches its data from GitHub while it builds, so every run
# publishes the current repositories and bio.
on:
  # Every push to main
  push:
    branches:
      - main
  # Daily, so new or updated "demo" repositories show up without a push
  schedule:
    - cron: "17 5 * * *"
  # By hand, from the Actions tab
  workflow_dispatch:
  # From another repository, e.g. after it deploys its own demo:
  #   gh api repos/MarcLlobet/MarcLlobet.github.io/dispatches -f event_type=refresh-portfolio
  repository_dispatch:
    types: [refresh-portfolio]

# Never deploy two builds at the same time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install playwright chromium browser
        run: pnpm exec playwright install chromium

      - name: Run prettier
        run: pnpm exec prettier --check .

      - name: Run eslint
        run: pnpm run lint

      - name: Run stylelint
        run: pnpm run lint:css

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build project
        run: pnpm run build
        env:
          GH_API_TOKEN: ${{ secrets.API_TOKEN }}
          GH_API_USERNAME: ${{ secrets.API_USERNAME }}
          # Fail instead of publishing the fixture snapshot
          PORTFOLIO_REQUIRE_LIVE_DATA: "true"

      - name: Build Storybook
        run: pnpm build-storybook --output-dir ./out/storybook

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
