name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Format, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fail on JavaScript files
        uses: MarcLlobet/ts-only@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run prettier
        run: pnpm exec prettier --check .

      - name: Run eslint
        run: pnpm run lint

      - name: Run stylelint
        run: pnpm run lint:css

      - name: Run unit tests
        run: pnpm exec vitest run

  layout:
    name: Layout at every viewport
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install the browser the layout check needs
        run: pnpm run install:browser

      - name: Build site
        run: pnpm build

      - name: Check layout at every viewport
        run: pnpm check:layout

      - name: Upload screenshots and report
        uses: actions/upload-artifact@v7
        with:
          name: layout-report
          path: layout-report
          retention-days: 14
