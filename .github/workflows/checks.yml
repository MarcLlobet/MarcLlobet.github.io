name: Checks

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - layout-snapshots
  workflow_dispatch:

jobs:
  static:
    name: Format, lint and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # Temporary: adds the stylelint packages and commits the lockfile.
      - name: Add stylelint packages
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[add-stylelint]')
        run: |
          pnpm add -D stylelint postcss-styled-syntax stylelint-config-recommended
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: add stylelint dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: pnpm install

      - name: Run prettier
        run: pnpm exec prettier --check .

      - name: Run eslint
        run: pnpm run lint

      - name: Run stylelint
        run: pnpm run lint:css

      - name: Run unit tests
        run: pnpm exec vitest run

  layout:
    name: Layout at every viewport
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install playwright chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build site (with committed data)
        run: pnpm exec next build

      - name: Check layout at every viewport
        run: pnpm check:layout

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-report
          path: layout-report
          retention-days: 14

      # Temporary: lets a reviewer without artifact access fetch the report via git.
      - name: Publish report to a snapshot branch
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[layout-snapshots]')
        run: |
          cd layout-report
          git init -q -b snapshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Layout report for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "snapshots:refs/heads/layout-snapshots"
