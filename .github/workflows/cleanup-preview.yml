name: Remove PR preview

on:
  pull_request:
    types: [closed]

# Shares a lane with deploy.yml — see its comment.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Remove this PR's slot and assemble the combined site
        run: pnpm tsx scripts/deploy-pages.ts cleanup

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./combined

  # Separate job — see deploy.yml's deploy job for why.
  deploy:
    needs: cleanup
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # See deploy.yml's identical step for why this is needed.
      - name: Wait for the uploaded artifact to be queryable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 10); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -gt 0 ]; then
              echo "Artifact is queryable (after ${i} check(s))."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Timed out waiting for the github-pages artifact to become queryable."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
