name: Remove PR preview

on:
  pull_request:
    types: [closed]

# Shares a lane with deploy.yml — see its comment.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Remove this PR's slot and assemble the combined site
        run: pnpm tsx scripts/deploy-pages.ts cleanup

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./combined

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
